name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - 'README.md'
      - 'LICENSE'
      - 'docs/**'
      - '.vscode/**'
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

# Superseded PR runs are cancelled; pushes to main always run to completion so
# every commit on the release branch has its own verified result.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  # Nx Cloud is not used; keep the run fully local and non-interactive.
  NX_NO_CLOUD: 'true'
  NX_TUI: 'false'

jobs:
  main:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          # Full history is required for `nx affected` to resolve a merge base.
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # Replacement for the Nx Cloud remote cache: reuse the local task cache
      # across runs, keyed by branch, falling back to any recent cache.
      - uses: actions/cache@v4
        with:
          path: .nx/cache
          key: nx-${{ runner.os }}-${{ github.ref_name }}-${{ github.sha }}
          restore-keys: |
            nx-${{ runner.os }}-${{ github.ref_name }}-
            nx-${{ runner.os }}-

      - run: bun install --frozen-lockfile

      # Exports NX_BASE / NX_HEAD for the affected commands below.
      - uses: nrwl/nx-set-shas@v4

      - name: Format check
        run: bunx nx format:check --base=$NX_BASE --head=$NX_HEAD

      - name: Lint, test, typecheck, build (affected)
        run: bunx nx affected -t lint test typecheck build --parallel=3
