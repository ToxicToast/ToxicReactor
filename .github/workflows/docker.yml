name: Docker

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
    paths:
      - 'packages/**'
      - 'package.json'
      - 'bun.lock'
      - 'tsconfig*.json'
      - 'nx.json'
      - '.github/workflows/docker.yml'
  workflow_dispatch:
    inputs:
      app:
        description: 'App directory under packages/ to build'
        required: false
        default: 'api'

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

env:
  APP: ${{ github.event.inputs.app || 'api' }}
  REGISTRY: ghcr.io

jobs:
  # Cheap guard: the NestJS app does not exist yet. Skip the (expensive) build
  # job instead of failing the workflow until packages/<APP>/Dockerfile lands.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      dockerfile: ${{ steps.check.outputs.dockerfile }}
      found: ${{ steps.check.outputs.found }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - id: check
        run: |
          path="packages/${APP}/Dockerfile"
          if [ -f "$path" ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$path not found - skipping image build."
          fi
          echo "dockerfile=$path" >> "$GITHUB_OUTPUT"

  build:
    needs: guard
    if: needs.guard.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.APP }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - uses: docker/build-push-action@v6
        with:
          # Build context is the workspace root: the Nx monorepo needs the root
          # package.json / bun.lock / tsconfig to resolve workspace packages.
          context: .
          file: ${{ needs.guard.outputs.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
