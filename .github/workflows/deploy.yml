name: Deploy

on:
  # Runs after Docker pushed a fresh image for main. workflow_run also fires when
  # the Docker workflow only ran its guard job, so the image tag is verified below.
  workflow_run:
    workflows: ['Docker']
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Image tag to deploy, e.g. sha-abc1234 or 1.2.3. Also used to roll back.'
        required: true
        type: string

permissions:
  contents: read
  packages: read

# Never deploy two revisions at once; queue instead of cancelling, so a started
# rollout always finishes.
concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  APP: api
  STACK_DIR: /opt/toxicreactor

jobs:
  guard:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      image: ${{ steps.resolve.outputs.image }}
      found: ${{ steps.verify.outputs.found }}
    steps:
      - id: resolve
        env:
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"
          else
            # Matches docker/metadata-action's `type=sha,format=short`.
            tag="sha-${HEAD_SHA:0:7}"
          fi
          echo "image=${REGISTRY}/${GITHUB_REPOSITORY,,}/${APP}:${tag}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: verify
        env:
          IMAGE: ${{ steps.resolve.outputs.image }}
        run: |
          if docker buildx imagetools inspect "$IMAGE" >/dev/null 2>&1; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "::notice::$IMAGE does not exist in the registry - nothing to deploy."
          fi

  deploy:
    needs: guard
    if: needs.guard.outputs.found == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Add required reviewers / branch restrictions to this environment in
    # Settings > Environments to gate production rollouts.
    environment:
      name: production
      url: ${{ vars.DEPLOY_URL }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          KNOWN_HOSTS: ${{ secrets.VPS_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          # Pinned host key: without it, StrictHostKeyChecking cannot detect a
          # man-in-the-middle on the deploy connection.
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 644 ~/.ssh/known_hosts

      - name: Copy stack files to VPS
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "mkdir -p '$STACK_DIR'"
          scp -i ~/.ssh/id_deploy -P "$VPS_PORT" \
            deploy/docker-compose.yml deploy/remote-deploy.sh \
            "$VPS_USER@$VPS_HOST:$STACK_DIR/"

      - name: Deploy
        env:
          VPS_HOST: ${{ secrets.VPS_HOST }}
          VPS_USER: ${{ secrets.VPS_USER }}
          VPS_PORT: ${{ secrets.VPS_PORT || '22' }}
          IMAGE: ${{ needs.guard.outputs.image }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$VPS_PORT" "$VPS_USER@$VPS_HOST" \
            "IMAGE='$IMAGE' STACK_DIR='$STACK_DIR' bash '$STACK_DIR/remote-deploy.sh'"

      - name: Public smoke test
        if: vars.DEPLOY_URL != ''
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        run: |
          code=$(curl -s -o /dev/null -w '%{http_code}' -L --max-time 25 "${DEPLOY_URL%/}/health")
          echo "HTTP $code"
          test "$code" = "200"

      - name: Clean up SSH key
        if: always()
        run: rm -f ~/.ssh/id_deploy
